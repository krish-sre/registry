name: Publish Notebook Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to tag the image (e.g. 1.0.0)"
        required: true
        type: string
      also_tag_latest:
        description: "Also push this image as :latest"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/karo-notebook

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.also_tag_latest }}
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:${VERSION}"
          if [ "$LATEST" = "true" ]; then tags="${tags},${image}:latest"; fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: notebook
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=JupyterHub single-user notebook with git, boto3 and the AWS CLI
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Scan with Trivy (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.image }}:${{ inputs.version }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
